name: deploy

on:
  push:
    branches: [main]

env:
  HOME: /var/lib/gitea-runner
  SKIP_NODES: nixbook
  SSH_OPTS: >-
    -i /var/lib/gitea-runner/.ssh/id_ed25519
    -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/var/lib/gitea-runner/known_hosts

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: CHECKING
        run: nix --extra-experimental-features "nix-command flakes" flake check --no-build

      - name: BUILDING
        run: |
          set -euo pipefail
          mkdir -p /var/lib/gitea-runner/gcroots

          hosts=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
            ".#nixosConfigurations" \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)')

          for host in $hosts; do
            nix --extra-experimental-features "nix-command flakes" build \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --out-link "/var/lib/gitea-runner/gcroots/$host"
          done

      - name: DEPLOYING
        run: |
          set -euo pipefail
          export NIX_SSHOPTS="$SSH_OPTS"

          nodes=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
            ".#deploy.nodes" \
            --apply 'ns: builtins.concatStringsSep " " (builtins.attrNames ns)')

          self=$(cat /proc/sys/kernel/hostname)
          failed=""

          for node in $nodes; do
            if [ "$node" = "$self" ]; then
              echo "skipping $node"
              continue
            fi

            case " $SKIP_NODES " in
              *" $node "*)
                echo "skipping $node"
                continue
                ;;
            esac

            host=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
              ".#deploy.nodes.$node.hostname")
            user=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
              ".#deploy.nodes.$node.sshUser")

            if ! ssh $SSH_OPTS -o BatchMode=yes -o ConnectTimeout=5 "$user@$host" true 2>/dev/null; then
              echo "skip $node ($host unreachable)"
              continue
            fi

            echo "deploy $node ($host)"
            deploy --skip-checks --ssh-opts "$SSH_OPTS" ".#$node" || failed="$failed $node"
          done

          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      - name: NOTIFYING
        run: |
          set -euo pipefail
          self=$(cat /proc/sys/kernel/hostname)
          closure=$(readlink -f "/var/lib/gitea-runner/gcroots/$self")
          current=$(readlink -f /run/current-system)

          if [ "$closure" = "$current" ]; then
            echo "$self up to date"
            exit 0
          fi

          diff=$(nix --extra-experimental-features "nix-command flakes" \
            store diff-closures "$current" "$closure")
          changes=$(head -20 <<<"$diff")

          text=$(printf '%s needs a switch\n\n%s\n\ndeploy .#%s\n\n%s' \
            "$self" "$(git log -1 --pretty='%h %s')" "$self" "$changes")

          nix --extra-experimental-features "nix-command flakes" run .#tg -- message "$text"
