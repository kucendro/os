name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

env:
  HOME: /var/lib/gitea-runner

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: START
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"

      - name: VERIFY COMMIT SIGNATURE
        id: signature
        run: git verify-commit HEAD

      - name: CHECK FLAKE & BUILDING
        run: nix --extra-experimental-features "nix-command flakes" flake check -L

      - name: ARCHIVE FLAKE INPUTS
        run: |
          set -euo pipefail
          roots=/var/lib/gitea-runner/gcroots
          rm -rf "${roots:?}"/*

          nix --extra-experimental-features "nix-command flakes" flake archive --json \
            | grep -o '/nix/store/[^"]*' \
            | while read -r path; do
                nix-store --add-root "$roots/$(basename "$path")" --realise "$path" > /dev/null
              done

      - name: PROMOTE
        run: git push ssh://git@nas:2222/kucendro/os.git HEAD:deploy

      - name: PUSH TO GRAFANA
        if: always()
        run: nix --extra-experimental-features "nix-command flakes" run .#ci-report -- deploy "${{ job.status }}" "$started"

      - name: FAIL (IF SO)
        if: failure()
        run: |
          reason="deploy failed"
          if [ "${{ steps.signature.outcome }}" = failure ]; then
            reason="signature not verified, not deployed"
          fi
          nix --extra-experimental-features "nix-command flakes" run .#tg -- message "$reason: $(git log -1 --pretty='%h %s')"
