name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

env:
  HOME: /var/lib/gitea-runner

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: STARTING
        run: echo "started=$(date +%s)" >> "$GITHUB_ENV"

      - name: VERIFYING
        id: signature
        run: git verify-commit HEAD

      - name: CHECKING
        run: nix --extra-experimental-features "nix-command flakes" flake check --no-build

      - name: BUILDING
        run: |
          set -euo pipefail
          mkdir -p /var/lib/gitea-runner/gcroots

          hosts=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
            ".#nixosConfigurations" \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)')

          for host in $hosts; do
            nix --extra-experimental-features "nix-command flakes" build \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --out-link "/var/lib/gitea-runner/gcroots/$host"
          done

      - name: PROMOTING
        run: git push ssh://git@nas:2222/kucendro/os.git HEAD:deploy

      - name: REPORTING
        if: always()
        run: nix --extra-experimental-features "nix-command flakes" run .#ci-report -- deploy "${{ job.status }}" "$started"

      - name: FAILING
        if: failure()
        run: |
          reason="deploy failed"
          if [ "${{ steps.signature.outcome }}" = failure ]; then
            reason="signature not verified, not deployed"
          fi
          nix --extra-experimental-features "nix-command flakes" run .#tg -- message "$reason: $(git log -1 --pretty='%h %s')"
