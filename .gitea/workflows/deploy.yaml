name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  HOME: /var/lib/gitea-runner
  SSH_OPTS: >-
    -i /var/lib/gitea-runner/.ssh/id_ed25519
    -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/var/lib/gitea-runner/known_hosts

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate diagrams & wiki
        run: nix --extra-experimental-features "nix-command flakes" run .#diagram

      - name: Commit if docs changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "docs already up to date"
          else
            git config user.name "gitea-actions"
            git config user.email "gitea-actions@kucendro.dev"
            git add docs
            git commit -m "docs: auto-regenerate [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: EDGE
        run: |
          set -euo pipefail
          export NIX_SSHOPTS="$SSH_OPTS"
          deploy --skip-checks --ssh-opts "$SSH_OPTS" .#edge

      - name: NIXBOOK
        run: |
          set -euo pipefail
          if ssh $SSH_OPTS -o ConnectTimeout=5 deploy@nixbook true 2>/dev/null; then
            export NIX_SSHOPTS="$SSH_OPTS"
            deploy --skip-checks --ssh-opts "$SSH_OPTS" .#nixbook
          else
            echo "nixbook offline — skipping"
          fi
