name: deploy

on:
  push:
    branches: [main]

env:
  HOME: /var/lib/gitea-runner
  SSH_OPTS: >-
    -i /var/lib/gitea-runner/.ssh/id_ed25519
    -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/var/lib/gitea-runner/known_hosts

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: CHECK
        run: nix --extra-experimental-features "nix-command flakes" flake check --no-build

      - name: BUILD
        run: |
          set -euo pipefail
          mkdir -p /var/lib/gitea-runner/gcroots

          hosts=$(nix --extra-experimental-features "nix-command flakes" eval --raw \
            ".#nixosConfigurations" \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)')

          for host in $hosts; do
            nix --extra-experimental-features "nix-command flakes" build \
              ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --out-link "/var/lib/gitea-runner/gcroots/$host"
          done

      - name: EDGE
        run: |
          set -euo pipefail
          export NIX_SSHOPTS="$SSH_OPTS"
          deploy --skip-checks --ssh-opts "$SSH_OPTS" .#edge
