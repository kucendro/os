name: phone-qr

on:
  push:
    branches: [main]
    paths:
      - services/phones/**
      - display/carbonfox.yaml
  workflow_dispatch:

env:
  HOME: /var/lib/gitea-runner

jobs:
  send:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: BUILDING SETUP SCRIPTS
        run: |
          set -euo pipefail
          nix_cmd="nix --extra-experimental-features nix-command --extra-experimental-features flakes"
          phones=$($nix_cmd eval --raw .#packages.x86_64-linux --apply \
            'attrs: builtins.concatStringsSep " " (builtins.filter (n: builtins.match "(termux|blink)-setup-.*" n != null) (builtins.attrNames attrs))')
          for pkg in $phones; do
            $nix_cmd build ".#$pkg" -o "result-$pkg"
          done

      - name: SENDING TO TELEGRAM
        run: |
          set -euo pipefail
          nix_cmd="nix --extra-experimental-features nix-command --extra-experimental-features flakes"
          tmp=$(mktemp -d)
          for bin in result-termux-setup-*/bin/termux-setup-*; do
            phone=${bin##*termux-setup-}
            "$bin" > "$tmp/$phone.sh"
            "$bin" --png "$tmp/$phone.png"

            $nix_cmd run .#tg -- photo "$tmp/$phone.png" "Termux setup for $phone"
            $nix_cmd run .#tg -- document "$tmp/$phone.sh" "bash $phone.sh in Termux"
          done
          for bin in result-blink-setup-*/bin/blink-setup-*; do
            phone=${bin##*blink-setup-}
            "$bin" > "$tmp/$phone.txt"
            "$bin" --png "$tmp/$phone.png"

            $nix_cmd run .#tg -- photo "$tmp/$phone.png" "Blink setup for $phone"
            $nix_cmd run .#tg -- document "$tmp/$phone.txt" "paste into Blink on $phone, theme and font at wiki/blink"
          done
