name: update

on:
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:

env:
  HOME: /var/lib/gitea-runner

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: native
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: UPDATING
        run: nix --extra-experimental-features "nix-command flakes" flake update

      - name: CHECKING
        run: nix --extra-experimental-features "nix-command flakes" flake check --no-build

      - name: COMMITING
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "nothing to update skipping my SON"
            exit 0
          fi
          git config user.name "actions"
          git config user.email "actions@kucendro.dev"
          git add flake.lock
          git commit -m "automatic weekly update"

      - name: PUSHING
        run: git push ssh://git@nas:2222/kucendro/os.git HEAD:main
