name: update

on:
  # schedule:
  #   - cron: "0 4 * * 6"
  workflow_dispatch:

env:
  HOME: /var/lib/gitea-runner

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: native
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: UPDATE
        run: nix --extra-experimental-features "nix-command flakes" flake update

      - name: CHECK
        run: nix --extra-experimental-features "nix-command flakes" flake check

      - name: COMMIT
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "update"
          git config user.email "actions@nas"
          git add flake.lock
          git commit -m "chore: weekly flake update"
          git push ssh://git@nas:2222/kucendro/os.git HEAD:main
