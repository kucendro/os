general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid launching multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on   # turn screen back on after wake
}

# Dim screen after 2.5 minutes
listener {
    timeout = 150                                # 2.5 min
    on-timeout = brightnessctl -s set 10         # save brightness & dim to 10%
    on-resume = brightnessctl -r                 # restore brightness
}

# Lock screen after 5 minutes
listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock session
}

# Turn off display after 5.5 minutes
listener {
    timeout = 330                                # 5.5 min
    on-timeout = hyprctl dispatch dpms off       # turn off screen
    on-resume = hyprctl dispatch dpms on         # turn on screen on activity
}

# Suspend after 15 minutes
listener {
    timeout = 900                                # 15 min
    on-timeout = systemctl suspend               # suspend
}
