################
### MONITORS ###
################

monitor = DP-1, 3440x1440@59.97, 0x0, 1      # Deep ultrawide set the built-in to 760x1140
monitor = DP-2, 1920x1080@60.00, 0x0, 1      # Glasses
monitor = eDP-1, 1920x1200@60, 760x1440, 1   # built-in on glasses set to 0x1080
monitor = , preferred, auto, 1


#################
### AUTOSTART ###
#################

 exec-once = nm-applet
 exec-once = noctalia-shell
 exec-once = hypridle -c ~/.config/hypridle/hypridle.conf
 exec-once = kdeconnectd
 exec-once = cider-2 & element-desktop & slack

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita


###################
### PERMISSIONS ###
###################

ecosystem {
   enforce_permissions = 1
}

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 0
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2
    active_opacity = 1
    inactive_opacity = 0.75
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
        size = 0
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes,

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us,cz
    kb_variant = ,qwerty
    kb_model = pc104
    kb_options = grp:alt_space_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace
gesture = 3, vertical, workspace 

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# 1. NOCTALIA SHELL
bindr = SUPER, SUPER_L, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, A, exec, noctalia-shell ipc call controlCenter toggle #"Settings"
bind = $mainMod, H, exec, noctalia-shell ipc call plugin:keybind-cheatsheet toggle #"Keybinds table"

# 2. WINDOWS
bind = $mainMod, left, movefocus, l #"Move focus left"
bind = $mainMod, right, movefocus, r #"Move focus right"
bind = $mainMod, up, movefocus, u #"Move focus up"
bind = $mainMod, down, movefocus, d #"Move focus down"
bind = $mainMod CTRL, left, movewindow, l #"Move window left"
bind = $mainMod CTRL, right, movewindow, r #"Move window right"
bind = $mainMod CTRL, up, movewindow, u #"Move window up"
bind = $mainMod CTRL, down, movewindow, d #"Move window down"
bind = $mainMod CTRL, o, togglesplit #"Toggle window split"
bind = $mainMod SHIFT, left, resizeactive, -20 0 #"Resize window left"
bind = $mainMod SHIFT, right, resizeactive, 20 0 #"Resize window right"
bind = $mainMod SHIFT, up, resizeactive, 0 -20 #"Resize window up"
bind = $mainMod SHIFT, down, resizeactive, 0 20 #"Resize window down"
bind = $mainMod, P, pseudo, #"Toggle pseudo"
bind = $mainMod, J, togglesplit, #"Change split ratio"
bind = $mainMod, S, exec, command grim -g "$(slurp)" #"Screenshot"
bind = $mainMod, V, togglefloating, #"Toggle floating"
bind = $mainMod, C, killactive, #"Close window"
bind = $mainMod, I, exec, command ~/nixos/secrets/toggle-password.sh #"Insert password"

# 3. WORKSPACES
bind = $mainMod, TAB,  workspace, e+1 #"Move to next workspace"
bind = $mainMod SHIFT, TAB, movetoworkspace, e+1 #"Move window to next workspace"

# 4. SPECIAL WORKSPACES
bind = $mainMod, W, togglespecialworkspace, magic #"Toggle special workspace"
bind = $mainMod SHIFT, W, movetoworkspace, special:magic #"Move window to special workspace"
bind = $mainMod CTRL, W, movetoworkspace, 1 #"Remove window from special workspace"

# 5. TMUX
bind = $mainMod, +, exec, command tmux attach -d -t default #"Attach default tmux session"
# # Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule { 
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize, minimize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = cider-to-special
    match:class = ^(Cider|cider).*$
    workspace = special:magic silent
}

windowrule {
    name = element-to-special
    match:class = ^(Element|element).*$
    workspace = special:magic silent
}

windowrule {
    name = slack-to-special
    match:class = ^(Slack|slack).*$
    workspace = special:magic silent
}

 windowrule {
  name = center-floating
  match:class = ^(Beeper|beeper).*$
  float = yes
  move = center
  size = 800x600
}

windowrule {
  name = kitty-oppacity
  match:class = ^(Kitty|kitty).*$
  opacity = 0.9
  move = right
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
