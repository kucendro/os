pre-commit:
  parallel: true
  commands:
    generating-diagrams:
      glob: "*.{nix,py,json}"
      run: |
        nix run .#diagram
        git add docs/topology.d2 docs/topology.svg docs/modules.d2 docs/modules.svg
      skip:
        - merge
        - rebase

    dry-check:
      glob: "*.{nix,json,lock}"
      run: |
        nix flake check --all-systems
      skip:
        - merge
