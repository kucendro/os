pre-commit:
  parallel: false
  commands:
    generating-diagrams:
      glob: "*.{nix,py,json}"
      run: |
        nix run .#diagram
        git add docs/topology.d2 docs/topology.svg docs/modules.d2 docs/modules.svg
      skip:
        - merge
        - rebase

    dry-build:
      glob: "*.{nix}"
      run: |
        nh os build .
      skip:
        - merge
