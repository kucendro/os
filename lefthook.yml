pre-commit:
  commands:
    format:
      glob: "*.{nix}"
      run: nixfmt {staged_files}
      stage_fixed: true
    papers:
      glob: "*.{typ, bib}"
      run: just paper
pre-push:
  follow: true
  commands:
    check:
      glob: "*.{nix,json,lock}"
      run: |
        nix flake check -L
      skip:
        - merge
