# Workstation container — runs the NixOS image built from `targets/workstation/`.
#
# Build the image (on a host that can build Linux nix derivations):
#   nix build .#packages.aarch64-linux.workstation-docker   # for Apple Silicon Docker
#   # or
#   nix build .#packages.x86_64-linux.workstation-docker    # for x86_64 hosts
# Then load it:
#   docker load < result
#
# Bring it up:
#   docker compose -f targets/workstation/docker-compose.yaml up -d
#
# First-time auth into the headscale tailnet (run once on the host after `up`):
#   docker compose -f targets/workstation/docker-compose.yaml exec workstation \
#     tailscale up --login-server=https://edge.kucendro.dev --authkey=<preauth-key>
# After that the workstation joins the mesh and is reachable as `workstation`
# (MagicDNS) from any other tailnet peer.

services:
  workstation:
    image: workstation:latest
    hostname: workstation
    restart: unless-stopped

    privileged: true
    cgroup: host

    devices:
      - /dev/net/tun:/dev/net/tun

    tmpfs:
      - /run
      - /tmp

    volumes:
      - ${HOME}/.docker-secrets/workstation-authorized-keys:/etc/workstation-ssh/authorized_keys:ro
      - ${HOME}/.docker-secrets/tailscale-authkey:/etc/tailscale/authkey:ro
      - workstation-tailscale-state:/var/lib/tailscale

    stop_signal: SIGRTMIN+3

volumes:
  workstation-tailscale-state:
